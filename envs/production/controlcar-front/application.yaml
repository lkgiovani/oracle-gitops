apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: controlcar-front
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: controlcar-front=ghcr.io/lkgiovani/controlcar-front
    # newest-build (nao semver): CI publica tags <sha40> imutaveis + latest.
    argocd-image-updater.argoproj.io/controlcar-front.update-strategy: newest-build
    argocd-image-updater.argoproj.io/controlcar-front.allow-tags: "regexp:^[0-9a-f]{40}$"
    # front e publico no ghcr, mas mantemos a credencial por uniformidade.
    argocd-image-updater.argoproj.io/controlcar-front.pull-secret: pullsecret:argocd/ghcr-creds
    argocd-image-updater.argoproj.io/controlcar-front.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/controlcar-front.helm.image-tag: image.tag
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/git-repository: git@github.com:lkgiovani/oracle-gitops.git
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:/envs/production/controlcar-front/values.yaml
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  destination:
    namespace: production
    server: https://kubernetes.default.svc
  project: oracle-environments
  sources:
    - repoURL: https://github.com/lkgiovani/oracle-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/lkgiovani/oracle-gitops.git
      targetRevision: main
      path: default
      helm:
        valueFiles:
          - $values/envs/production/controlcar-front/values.yaml
  syncPolicy:
    automated:
      allowEmpty: false
      prune: true
      selfHeal: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
