fullnameOverride: controlcar-front
image:
  repository: ghcr.io/lkgiovani/controlcar-front
  tag: "113cb72142b69cd9a2378775c9e637f89e228d1c"
  pullPolicy: Always
service:
  port: 8080
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
# nginx-unprivileged com readOnlyRootFilesystem precisa de /tmp (pid/temp)
# e /var/cache/nginx graváveis.
volumes:
- name: tmp
  emptyDir: {}
- name: nginx-cache
  emptyDir: {}
volumeMounts:
- name: tmp
  mountPath: /tmp
- name: nginx-cache
  mountPath: /var/cache/nginx
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
# Sobe no listener wildcard existente *.lkgiovani.com (padrão portfolio):
# sectionName: https evita casar com qualquer outro listener/apex domain
# do Gateway compartilhado. Nenhum listener/Certificate novo é criado aqui.
httpRoute:
  enabled: true
  parentRefs:
  - name: default
    namespace: gateway-system
    sectionName: https
  hostnames:
  - controlcar.lkgiovani.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
imagePullSecrets:
- name: ghcr-pull
