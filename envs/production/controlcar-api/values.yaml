fullnameOverride: controlcar-api
image:
  repository: ghcr.io/lkgiovani/controlcar-api
  tag: "cfd02fbe2617bc5b0324e5041a9ec3dc98ffcd96"
  pullPolicy: Always
service:
  port: 3000
# O binário Go roda como `appuser` (non-root) desde o Dockerfile, sem escrita
# em disco local (arquivos vão para R2, não para volume) — readOnlyRootFilesystem
# seguro sem volumes extras de /tmp.
podSecurityContext:
  runAsNonRoot: true
  # UID numérico: o Dockerfile usa `USER appuser` (nome), e o k8s com runAsNonRoot
  # não consegue verificar não-root por nome — precisa de UID. O binário Go é
  # world-executable e não escreve em disco (R2 + readOnlyRootFilesystem), então
  # roda em qualquer UID não-zero.
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
env:
  configMapName: controlcar-api-config
  secretName: controlcar-api-secret
# Rotas reais (health module): /healthz e /readyz — NUNCA /health.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  failureThreshold: 3
# failureThreshold generoso: a API faz dial síncrono em Redis/RabbitMQ no boot
# (Pitfall 7) — o pod deve tolerar as deps ainda subindo sem ser reiniciado à toa.
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 10
resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
# D-07: mínimo de 2 réplicas para a API em produção.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
# Sobe no listener wildcard existente *.lkgiovani.com (sectionName: https),
# igual portfolio/controlcar-front — nenhum Gateway/Certificate novo.
httpRoute:
  enabled: true
  parentRefs:
  - name: default
    namespace: gateway-system
    sectionName: https
  hostnames:
  - controlcar-api.lkgiovani.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
imagePullSecrets:
- name: ghcr-pull
