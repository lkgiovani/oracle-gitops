apiVersion: batch/v1
kind: Job
metadata:
  name: controlcar-api-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: flyway
          image: flyway/flyway:11
          args:
            - -url=jdbc:postgresql://controlcar-postgres-rw.database.svc:5432/controlcar
            - -user=$(DB_USER)
            - -password=$(DB_PASSWORD)
            - -connectRetries=10
            - -placeholders.admin_email=$(SEED_ADMIN_EMAIL)
            - -placeholders.admin_password=$(SEED_ADMIN_PASSWORD)
            # Multi-tenant v3.0: a V21 cria o role de aplicacao controlcar_app
            # (nao-superusuario, sem BYPASSRLS) com esta senha, e a V22 seeda o
            # platform_admin. Os tres valores vivem no controlcar-migration-secret
            # (SOPS), como admin_email/admin_password desde a V16. Sem eles o
            # Flyway falha ao resolver o placeholder e o hook PreSync trava.
            - -placeholders.app_db_password=$(APP_DB_PASSWORD)
            - -placeholders.platform_admin_email=$(SEED_PLATFORM_ADMIN_EMAIL)
            - -placeholders.platform_admin_password=$(SEED_PLATFORM_ADMIN_PASSWORD)
            - migrate
          # Seed-admin (Pitfall 5) e credenciais de DB vivem SOMENTE neste
          # secret, dedicado ao Job efemero de migration - o Deployment de
          # longa duracao da api usa um secret totalmente separado e nunca
          # le SEED_ADMIN_EMAIL/SEED_ADMIN_PASSWORD nem DB_USER/DB_PASSWORD.
          envFrom:
            - secretRef:
                name: controlcar-migration-secret
          volumeMounts:
            - name: sql
              mountPath: /flyway/sql
      volumes:
        - name: sql
          configMap:
            name: controlcar-migrations
