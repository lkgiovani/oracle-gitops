apiVersion: v1
kind: ConfigMap
metadata:
  name: controlcar-api-config
data:
  # Apenas variaveis nao-sensiveis. Credenciais (DB/Redis/RabbitMQ/JWT/SMTP/R2)
  # vem via SOPS, referenciado por nome em values.yaml (envFrom do chart) -
  # nunca literais aqui.
  SERVICE_NAME: controlcar-api
  PORT: "3000"
  APP_ENV: production
  APP_BASE_URL: https://controlcar-api.lkgiovani.com
  WEB_BASE_URL: https://controlcar.lkgiovani.com
  CORS_ALLOWED_ORIGIN: https://controlcar.lkgiovani.com
  # Cookie CSRF compartilhado entre front e API (subdomínios de lkgiovani.com),
  # senão o front não lê o cookie e o double-submit falha com 403 no login.
  COOKIE_DOMAIN: .lkgiovani.com
  LOG_LEVEL: info
