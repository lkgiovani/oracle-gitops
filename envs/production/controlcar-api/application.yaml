apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: controlcar-api
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: controlcar-api=ghcr.io/lkgiovani/controlcar-api
    # newest-build (nao semver): o CI publica tags <sha40> imutaveis + latest; a
    # sha e a fonte de verdade auditavel. allow-tags filtra so as tags de 40 hex
    # (ignora "latest"), e newest-build escolhe a de build mais recente.
    argocd-image-updater.argoproj.io/controlcar-api.update-strategy: newest-build
    argocd-image-updater.argoproj.io/controlcar-api.allow-tags: "regexp:^[0-9a-f]{40}$"
    # pacote ghcr PRIVADO: o image-updater precisa de credencial de leitura
    # (secret dockerconfigjson no ns argocd) pra listar tags/metadata.
    argocd-image-updater.argoproj.io/controlcar-api.pull-secret: pullsecret:argocd/ghcr-creds
    argocd-image-updater.argoproj.io/controlcar-api.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/controlcar-api.helm.image-tag: image.tag
    # write-back via git com deploy key SSH (write) no oracle-gitops. git-repository
    # forca a URL SSH porque as sources do Application usam HTTPS (leitura anonima).
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/git-repository: git@github.com:lkgiovani/oracle-gitops.git
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:/envs/production/controlcar-api/values.yaml
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  destination:
    namespace: production
    server: https://kubernetes.default.svc
  project: oracle-environments
  sources:
    - repoURL: https://github.com/lkgiovani/oracle-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/lkgiovani/oracle-gitops.git
      targetRevision: main
      path: default
      helm:
        valueFiles:
          - $values/envs/production/controlcar-api/values.yaml
    # Fonte extra (directory/kustomize): Job PreSync do Flyway + ConfigMaps
    # (env nao-sensivel + SQL espelhado). O hook PreSync garante que a
    # migration roda antes do Deployment do chart Helm reconciliar.
    - repoURL: https://github.com/lkgiovani/oracle-gitops.git
      targetRevision: main
      path: envs/production/controlcar-api/migration
  syncPolicy:
    automated:
      allowEmpty: false
      prune: true
      selfHeal: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
