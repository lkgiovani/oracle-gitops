apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlcar-redis
  namespace: production
  labels:
    app.kubernetes.io/name: controlcar-redis
    app.kubernetes.io/part-of: controlcar-deps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: controlcar-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controlcar-redis
        app.kubernetes.io/part-of: controlcar-deps
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--save"
            - ""
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "redis-cli --no-auth-warning -a \"$REDIS_PASSWORD\" ping | grep -q PONG"
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        # Ephemeral by design (ADR-004: Redis is cache, never source of truth).
        # No PVC — data does not survive pod restarts.
        - name: data
          emptyDir: {}
