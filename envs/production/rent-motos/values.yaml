fullnameOverride: rent-motos

image:
  repository: docker.io/lkgiovani/rent-motos
  tag: "latest"
  pullPolicy: Always

service:
  port: 8080

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

# nginx-unprivileged com readOnlyRootFilesystem precisa de /tmp (pid/temp)
# e /var/cache/nginx graváveis.
volumes:
  - name: tmp
    emptyDir: {}
  - name: nginx-cache
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: nginx-cache
    mountPath: /var/cache/nginx

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

# Sem sectionName: o HTTPRoute encaixa por hostname nos listeners
# https-rentmotos / https-rentmotos-www (+ o listener http :80).
httpRoute:
  enabled: true
  parentRefs:
    - name: default
      namespace: gateway-system
  hostnames:
    - rent-motos.com
    - www.rent-motos.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
